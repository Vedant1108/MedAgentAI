version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: medagent_db
    environment:
      POSTGRES_USER: medagent
      POSTGRES_PASSWORD: medagent_password
      POSTGRES_DB: medagent_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
